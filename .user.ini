; Raises PHP's upload limits for this site so catalog PDFs and product
; photos aren't silently rejected by a host's small defaults (often
; 2-8MB). Only takes effect on hosts running PHP-FPM/CGI (the vast
; majority of shared hosting, cPanel included) — mod_php ignores this
; file entirely. Changes can take a few minutes to apply after upload.
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
memory_limit = 256M
